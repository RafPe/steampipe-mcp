# Example: steampipe-mcp as a remote MCP server backed by a Steampipe
# container, both on a private docker network. Copy this file to
# docker-compose.yml, generate a token, and run `docker compose up`.
#
#   openssl rand -hex 32
#
# See docs/remote-deployment.md for auth modes, Host/Origin validation, and
# the threat model this setup relies on.
services:
  steampipe:
    # ghcr.io/turbot/steampipe only publishes a ":latest" tag (no versioned
    # tags), so it is pinned by digest instead, resolved from that tag at the
    # time this file was written:
    #   docker manifest inspect ghcr.io/turbot/steampipe:latest
    image: ghcr.io/turbot/steampipe@sha256:0ef5375ffb284c3ea330781610e5d52ac9c954cd06a8d0b1154f9886b71e2de9
    command: ["steampipe", "service", "start", "--foreground"]
    volumes:
      - ./steampipe-config:/home/steampipe/.steampipe/config
    networks:
      - steampipe-net

  mcp:
    image: ghcr.io/rafpe/steampipe-mcp:0.2.0
    environment:
      STEAMPIPE_MCP_AUTH_MODE: token
      # Required: set this to a token generated with `openssl rand -hex 32`
      # (at least 32 characters). Put it in a .env file next to this compose
      # file (STEAMPIPE_MCP_AUTH_TOKEN=...), never commit it.
      STEAMPIPE_MCP_AUTH_TOKEN: ${STEAMPIPE_MCP_AUTH_TOKEN:?set STEAMPIPE_MCP_AUTH_TOKEN, e.g. via openssl rand -hex 32}
      # Steampipe's embedded postgres has no TLS, and "steampipe" (a docker
      # network hostname) is not loopback, so TLS certificate verification -
      # on by default for non-loopback hosts - must be explicitly disabled.
      STEAMPIPE_MCP_WORKSPACE_DATABASE: postgresql://steampipe@steampipe:9193/steampipe?sslmode=disable
    ports:
      - "27123:27123"
    depends_on:
      - steampipe
    networks:
      - steampipe-net

networks:
  steampipe-net:

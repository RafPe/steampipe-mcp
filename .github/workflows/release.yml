name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Pinned binfmt image (the action's default is tonistiigi/binfmt:latest,
      # which moved between 0.2.1 and 0.3.0). Keep in sync with ci.yml.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.0.4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Default `flavor` (latest=auto) adds the "latest" tag automatically
      # for a semver release tag without pre-release/build metadata - i.e.
      # only on a push matching [0-9]+.[0-9]+.[0-9]+, never on type=sha alone.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/rafpe/steampipe-mcp
          tags: |
            type=semver,pattern={{version}}
            type=sha
          labels: |
            org.opencontainers.image.source=https://github.com/RafPe/steampipe-mcp

      # Pre-push gate (R21): build linux/amd64 into the local Docker daemon
      # (no push) and Trivy-scan it, so a CRITICAL finding fails the release
      # before any tag (including "latest") is published. Only amd64 can be
      # loaded and scanned here; arm64 is scanned after the push below.
      - name: Build image for pre-push scan (linux/amd64, no push)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: steampipe-mcp:prepush-scan
          cache-from: type=gha

      - name: Scan local image with Trivy before push (linux/amd64)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: steampipe-mcp:prepush-scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.70.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Post-push scans. The arm64 image can only be scanned once pushed, so
      # a CRITICAL failure here means the git tag and the image tags
      # (including "latest") are ALREADY PUBLIC: delete the git tag and the
      # affected GHCR image versions, fix, and re-release.
      #
      # Scans the exact pushed manifest by digest (not a tag, which could
      # later move), so what is scanned is what was published. The digest
      # output is a manifest-list digest (linux/amd64 + linux/arm64); without
      # --platform, Trivy's registry puller resolves it to a single
      # architecture (whichever its own platform-selection default picks),
      # leaving the other arch unscanned. TRIVY_PLATFORM makes that explicit
      # instead - it's the env-var form of trivy image's --platform flag
      # (https://aquasecurity.github.io/trivy/latest/docs/configuration/#environment-variables),
      # which trivy-action's composite steps pass through unchanged.
      - name: Scan image with Trivy (linux/amd64)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ghcr.io/rafpe/steampipe-mcp@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.70.0

      - name: Scan image with Trivy (linux/arm64)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ghcr.io/rafpe/steampipe-mcp@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.70.0
